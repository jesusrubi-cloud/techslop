name: Prueba manual ElevenLabs (máximo 15 s)
on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: ID de una voz de tu cuenta etiquetada como Mexican y Spanish
        required: true
        type: string
      authorize_one_request:
        description: Autorizo UNA generación, máximo 80 caracteres; puede consumir créditos
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: elevenlabs-manual-test
  cancel-in-progress: false
jobs:
  test:
    if: ${{ inputs.authorize_one_request == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar y comprobar herramientas de audio
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 no está disponible en el runner."
            exit 1
          fi
          echo "Python: $(command -v python3)"
          python3 --version

          missing_tools=()
          for tool in ffmpeg ffprobe; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::notice::Herramienta ausente: $tool"
              missing_tools+=("$tool")
            else
              echo "Herramienta disponible: $tool ($(command -v "$tool"))"
            fi
          done
          if (( ${#missing_tools[@]} > 0 )); then
            echo "::notice::Instalando el paquete ffmpeg de Ubuntu mediante APT (incluye FFmpeg y FFprobe)."
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
            hash -r
          else
            echo "FFmpeg y FFprobe ya están disponibles; no es necesario instalar paquetes."
          fi

          for tool in ffmpeg ffprobe; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool sigue sin estar disponible después de preparar el runner."
              exit 1
            fi
            echo "$tool: $(command -v "$tool")"
            "$tool" -version
          done
      - name: Generar una sola prueba explícitamente autorizada
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id }}
        run: >-
          python3 scripts/elevenlabs_manual_test.py
          --execute-one-request
          --voice-id "$VOICE_ID"
          --output elevenlabs-test
      - name: Descargar MP3 e informe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elevenlabs-es-mx-prueba-15s
          path: |
            elevenlabs-test/elevenlabs-es-mx-test.mp3
            elevenlabs-test/report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
