name: Prueba manual ElevenLabs (máximo 15 s)
on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: ID de una voz de tu cuenta etiquetada como Mexican y Spanish
        required: true
        type: string
      authorize_one_request:
        description: Autorizo UNA generación, máximo 80 caracteres; puede consumir créditos
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: elevenlabs-manual-test
  cancel-in-progress: false
jobs:
  test:
    if: ${{ inputs.authorize_one_request == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar herramientas de audio
        run: |
          command -v python3
          command -v ffmpeg
          command -v ffprobe
      - name: Generar una sola prueba explícitamente autorizada
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id }}
        run: >-
          python3 scripts/elevenlabs_manual_test.py
          --execute-one-request
          --voice-id "$VOICE_ID"
          --output elevenlabs-test
      - name: Descargar MP3 e informe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elevenlabs-es-mx-prueba-15s
          path: |
            elevenlabs-test/elevenlabs-es-mx-test.mp3
            elevenlabs-test/report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
